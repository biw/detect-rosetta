name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
          - os: ubuntu-22.04
            arch: x64
          - os: macos-latest
            arch: arm64
          - os: macos-15-intel
            arch: x64
          - os: windows-latest
            arch: x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "22"
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install

      - name: Build TypeScript
        run: vp pack

      - name: Build native addon
        if: runner.os == 'macOS'
        run: vp run build:native

      - name: Run tests
        run: vp test

      - name: Display Rosetta detection result
        run: node -e "import('./dist/index.js').then(m => console.log('Running under Rosetta:', m.default()))"

      - name: Create prebuild
        if: runner.os == 'macOS'
        run: vp run prebuild

      - name: Upload prebuild artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: prebuild-${{ matrix.os }}-${{ matrix.arch }}
          path: prebuilds/
          retention-days: 7

  # Test Rosetta detection by running x86_64 Node under Rosetta on Apple Silicon
  rosetta-test:
    needs: build
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Intel prebuild
        uses: actions/download-artifact@v4
        with:
          name: prebuild-macos-15-intel-x64
          path: prebuilds/

      - name: Install x86_64 Node.js via nvm
        run: |
          # Install nvm
          curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.1/install.sh | bash
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

          # Install x86_64 Node
          arch -x86_64 /bin/bash -c "source $NVM_DIR/nvm.sh && nvm install 22"

          # Verify installation
          arch -x86_64 /bin/bash -c "source $NVM_DIR/nvm.sh && node --version && node -p 'process.arch'"

      - name: Enable Corepack for x86_64 Node
        run: |
          export NVM_DIR="$HOME/.nvm"
          arch -x86_64 /bin/bash -c "source $NVM_DIR/nvm.sh && corepack enable"

      - name: Install dependencies
        run: |
          export NVM_DIR="$HOME/.nvm"
          arch -x86_64 /bin/bash -c "source $NVM_DIR/nvm.sh && pnpm install --frozen-lockfile"

      - name: Build TypeScript
        run: |
          export NVM_DIR="$HOME/.nvm"
          arch -x86_64 /bin/bash -c "source $NVM_DIR/nvm.sh && pnpm exec vp pack"

      - name: Verify Rosetta detection returns true
        run: |
          export NVM_DIR="$HOME/.nvm"
          RESULT=$(arch -x86_64 /bin/bash -c "source $NVM_DIR/nvm.sh && node -e \"import('./dist/index.js').then(m => console.log(m.default()))\"")
          echo "detectRosetta() returned: $RESULT"
          if [ "$RESULT" != "true" ]; then
            echo "ERROR: Expected detectRosetta() to return true under Rosetta, got: $RESULT"
            exit 1
          fi
          echo "SUCCESS: Rosetta detection working correctly"

  publish:
    needs: rosetta-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/publish.yml
    permissions:
      actions: read
      contents: write
      id-token: write
